<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed dark background (maskable-safe: key content kept within center 80%) -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.6" stop-color="#f5f0e8"/>
      <stop offset="1" stop-color="#e8dfc8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c389"/>
      <stop offset="1" stop-color="#a07840"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
  </defs>

  <!-- Gold accent bar (the "MD" branding strip) -->
  <rect x="120" y="120" width="272" height="14" rx="7" fill="url(#gold)"/>

  <!-- Keyboard panel -->
  <g>
    <!-- White keys: 7 keys -->
    <g>
      <rect x="120" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="159" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="198" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="237" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="276" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="315" y="160" width="36" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
      <rect x="354" y="160" width="38" height="232" rx="6" fill="url(#white)" stroke="#bbb" stroke-width="2"/>
    </g>
    <!-- Black keys -->
    <g>
      <rect x="143" y="160" width="24" height="150" rx="4" fill="url(#black)"/>
      <rect x="184" y="160" width="24" height="150" rx="4" fill="url(#black)"/>
      <rect x="262" y="160" width="24" height="150" rx="4" fill="url(#black)"/>
      <rect x="301" y="160" width="24" height="150" rx="4" fill="url(#black)"/>
      <rect x="340" y="160" width="24" height="150" rx="4" fill="url(#black)"/>
    </g>
  </g>
</svg>
